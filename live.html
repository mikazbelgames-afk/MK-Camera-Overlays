<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MK Camera Overlay 2.1 — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Berkshire+Swash&family=Great+Vibes&family=Cinzel:wght@400;700&family=Fredoka:wght@400;600;700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
    .wrap{position:fixed;inset:0;display:grid;place-items:center;background:transparent}.stage{position:absolute;background:transparent;overflow:hidden;transform-origin:center center}
    .overlay-layer{position:absolute;transform-origin:center center}.frame-shape{width:100%;height:100%;border:var(--bw) solid transparent;border-radius:var(--radius);background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3),var(--c1)) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 var(--blur) var(--glow1)) drop-shadow(0 0 calc(var(--blur) * .45) rgba(255,255,255,.6))}
    .builtin-svg{width:100%;height:100%;display:block;object-fit:contain;overflow:visible;filter:drop-shadow(0 0 var(--blur) var(--glow1))}.image-stack{position:relative;width:100%;height:100%;isolation:isolate}.image-layer{position:relative;z-index:2;width:100%;height:100%;display:block;object-fit:contain;filter:none}.image-glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:var(--glow1);filter:blur(var(--blur));-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
    .text-layer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;padding:8px;color:var(--textColor);font-family:var(--fontFamily);font-size:var(--fontSize);font-weight:var(--fontWeight);line-height:1.06;text-shadow:0 0 var(--blur) var(--glow1)}
    .particle-field{width:100%;height:100%;position:relative;overflow:visible}.particle{position:absolute;border-radius:999px;pointer-events:none;transform-origin:center center;box-shadow:0 0 10px currentColor}.particle.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.particle.petal{border-radius:60% 40% 65% 35% / 55% 45% 55% 45%}.particle.firefly{border-radius:999px;filter:blur(.3px)}
    @keyframes mkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--strength)*-1px))}}@keyframes mkSway{0%,100%{transform:rotate(calc(var(--strength)*-.35deg))}50%{transform:rotate(calc(var(--strength)*.35deg))}}@keyframes mkBreathe{0%,100%{transform:scale(1)}50%{transform:scale(calc(1 + var(--strength)*.0025))}}@keyframes mkPulse{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(calc(1 + var(--strength)*.004))}}@keyframes mkRotate{to{transform:rotate(360deg)}}@keyframes mkMaskGlowColor{0%,100%{background-color:var(--glow1)}50%{background-color:var(--glow2)}}@keyframes mkGlowShift{0%,100%{filter:drop-shadow(0 0 var(--blur) var(--glow1)) drop-shadow(0 0 calc(var(--blur) * .45) rgba(255,255,255,.55))}50%{filter:drop-shadow(0 0 var(--blur) var(--glow2)) drop-shadow(0 0 calc(var(--blur) * .45) rgba(255,255,255,.72))}}@keyframes mkParticleFloat{0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot));opacity:0}}
  </style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage"></div></div>
<script>
(() => {
  const LOOP=15, stage=document.getElementById('stage'); let project=null;
  function ensureParticles(layer){ if(layer.type==='particles' && (!layer.particles || layer.particles.length!==Number(layer.count||0))){ layer.particles=[]; } }
  function svgMarkup(layer){ const c=layer.color||'#ffb8ea'; if(layer.type==='earLeft'||layer.type==='earRight'){ const mirror=layer.type==='earRight'?'transform="translate(200 0) scale(-1 1)"':''; return `<svg class="builtin-svg" viewBox="0 0 200 200"><g ${mirror}><path d="M24 168 C24 88 42 34 94 10 C101 62 110 105 157 151 C116 151 72 159 24 168 Z" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"/><path d="M46 145 C49 91 60 57 84 37 C89 75 100 112 130 140" fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/></g></svg>`; } if(layer.type==='sakura') return `<svg class="builtin-svg" viewBox="0 0 200 200"><g fill="${c}" stroke="#fff0fb" stroke-width="2"><path d="M100 92 C56 76 36 36 67 25 C89 17 99 42 100 61 C101 42 112 17 134 25 C165 36 145 76 100 92Z"/><path d="M108 100 C124 56 164 36 175 67 C183 89 158 99 139 100 C158 101 183 112 175 134 C164 165 124 145 108 100Z"/><path d="M100 108 C144 124 164 164 133 175 C111 183 101 158 100 139 C99 158 88 183 66 175 C35 164 55 124 100 108Z"/><path d="M92 100 C76 144 36 164 25 133 C17 111 42 101 61 100 C42 99 17 88 25 66 C36 35 76 55 92 100Z"/></g><circle cx="100" cy="100" r="11" fill="#ffe26d"/></svg>`; if(layer.type==='vine') return `<svg class="builtin-svg" viewBox="0 0 500 150"><path d="M20 106 C135 15 250 139 480 42" fill="none" stroke="#c88b9a" stroke-width="7" stroke-linecap="round"/><g fill="${c}" stroke="#fff0fb" stroke-width="1.5"><circle cx="80" cy="73" r="18"/><circle cx="170" cy="74" r="14"/><circle cx="280" cy="88" r="18"/><circle cx="385" cy="59" r="15"/><circle cx="449" cy="45" r="10"/></g><g fill="#ffe26d"><circle cx="80" cy="73" r="5"/><circle cx="170" cy="74" r="4"/><circle cx="280" cy="88" r="5"/><circle cx="385" cy="59" r="4"/><circle cx="449" cy="45" r="3"/></g></svg>`; if(layer.type==='sparkles') return `<svg class="builtin-svg" viewBox="0 0 500 500"><g fill="${c}"><path d="M90 34 L98 72 L136 80 L98 88 L90 126 L82 88 L44 80 L82 72Z"/><path d="M380 104 L386 130 L412 136 L386 142 L380 168 L374 142 L348 136 L374 130Z"/><path d="M236 296 L245 338 L287 347 L245 356 L236 398 L227 356 L185 347 L227 338Z"/><circle cx="420" cy="360" r="7"/><circle cx="140" cy="410" r="5"/><circle cx="308" cy="82" r="4"/></g></svg>`; return ''; }
  function render(){
    stage.innerHTML=''; stage.style.width=project.canvas.width+'px'; stage.style.height=project.canvas.height+'px';
    project.layers.forEach((layer,index)=>{ if(layer.visible===false) return; ensureParticles(layer); const el=document.createElement('div'); el.className='overlay-layer'; Object.assign(el.style,{left:(layer.x-layer.width/2)+'px',top:(layer.y-layer.height/2)+'px',width:layer.width+'px',height:layer.height+'px',opacity:(layer.opacity??100)/100,transform:`rotate(${layer.rotation||0}deg)`,zIndex:index+1,'--blur':(layer.glowBlur||0)+'px','--glow1':layer.glowColor||'#ff68cf','--glow2':layer.glowColor2||'#8f6cff'}); el.style.setProperty('--strength',String(layer.strength||10)); const anims=[]; if(layer.animation&&layer.animation!=='none') anims.push(`mk${layer.animation.charAt(0).toUpperCase()+layer.animation.slice(1)} ${LOOP/Math.max(1,Number(layer.cycles)||1)}s ${layer.animation==='rotate'?'linear':'ease-in-out'} infinite`);
      if(layer.type==='frame'){ const shape=document.createElement('div'); shape.className='frame-shape'; const radius=layer.shape==='circle'?'50%':layer.shape==='square'?'0%':layer.shape==='vertical'?Math.max(18,layer.radius||22)+'%':(layer.radius||22)+'%'; Object.assign(shape.style,{'--bw':(layer.borderWidth||8)+'px','--radius':radius,'--c1':layer.color1||'#ffd0ea','--c2':layer.color2||'#ff78d4','--c3':layer.color3||'#8f6cff'}); if(layer.glowShift) shape.style.animation=[anims.join(', '),`mkGlowShift ${LOOP/Math.max(1,Number(layer.cycles)||1)}s ease-in-out infinite`].filter(Boolean).join(', '); else if(anims.length) shape.style.animation=anims.join(', '); el.appendChild(shape); }
      else if(layer.type==='text'){ const t=document.createElement('div'); t.className='text-layer'; t.textContent=layer.text||''; Object.assign(t.style,{'--textColor':layer.textColor||'#fff4ff','--fontFamily':layer.font||'Berkshire Swash','--fontSize':(layer.fontSize||64)+'px','--fontWeight':layer.fontWeight||'700'}); if(layer.glowShift) t.style.animation=[anims.join(', '),`mkGlowShift ${LOOP/Math.max(1,Number(layer.cycles)||1)}s ease-in-out infinite`].filter(Boolean).join(', '); else if(anims.length) t.style.animation=anims.join(', '); el.appendChild(t); }
      else if(layer.type==='image'){ const src=layer.processedSrc||layer.src; const stack=document.createElement('div'); stack.className='image-stack'; if(anims.length) stack.style.animation=anims.join(', '); const glow=document.createElement('div'); glow.className='image-glow'; glow.style.webkitMaskImage=`url("${src}")`; glow.style.maskImage=`url("${src}")`; glow.style.opacity=String((layer.imageGlowOpacity??85)/100); glow.style.transform=`scale(${1+(Number(layer.imageGlowSpread)||0)/100})`; if(layer.glowShift) glow.style.animation=`mkMaskGlowColor ${LOOP/Math.max(1,Number(layer.cycles)||1)}s ease-in-out infinite`; const img=document.createElement('img'); img.className='image-layer'; img.src=src; stack.append(glow,img); el.appendChild(stack); }
      else if(layer.type==='particles'){ const box=document.createElement('div'); box.className='particle-field'; (layer.particles||[]).forEach(p=>{ const s=document.createElement('span'); s.className=`particle ${layer.preset||'petal'}`; s.style.left=p.x+'%'; s.style.top=p.y+'%'; s.style.width=p.size+'px'; s.style.height=Math.max(3,p.size*(layer.preset==='petal'?1.4:1))+'px'; s.style.color=p.color; s.style.opacity=p.alpha; s.style.setProperty('--dx', p.dx+'px'); s.style.setProperty('--dy', p.dy+'px'); s.style.setProperty('--rot', p.rot+'deg'); s.style.animation=`mkParticleFloat ${Math.max(2,p.duration)}s linear ${p.delay}s infinite`; box.appendChild(s); }); el.appendChild(box); }
      else { el.innerHTML=svgMarkup(layer); const target=el.firstElementChild; if(target){ if(layer.glowShift) target.style.animation=[anims.join(', '),`mkGlowShift ${LOOP/Math.max(1,Number(layer.cycles)||1)}s ease-in-out infinite`].filter(Boolean).join(', '); else if(anims.length) target.style.animation=anims.join(', '); } }
      stage.appendChild(el);
    }); resize();
  }
  function resize(){ if(!project) return; const scale=Math.min(innerWidth/project.canvas.width, innerHeight/project.canvas.height); stage.style.transform=`translate(-50%,-50%) scale(${scale})`; stage.style.left='50%'; stage.style.top='50%'; }
  async function load(){ const params=new URLSearchParams(location.search); if(params.get('local')==='1'){ try{ project=JSON.parse(localStorage.getItem('mkCameraOverlayProject')); }catch(e){} } if(!project){ const url=params.get('config')||'overlay.json'; const res=await fetch(url,{cache:'no-store'}); project=await res.json(); } render(); }
  addEventListener('resize',resize); load().catch(console.error);
})();
</script>
</body>
</html>

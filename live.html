<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MK Camera Overlay — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}.viewport{position:fixed;inset:0;overflow:hidden;background:transparent}.stage{position:absolute;left:50%;top:50%;transform-origin:center;background:transparent;overflow:hidden}.overlay-layer{position:absolute;transform-origin:center;user-select:none}.frame-shape{width:100%;height:100%;border:var(--border-width) solid transparent;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3),var(--c1)) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;border-radius:var(--radius);filter:drop-shadow(0 0 var(--glow-blur) var(--glow-color)) drop-shadow(0 0 7px rgba(255,255,255,.5))}.builtin-svg,.image-layer{width:100%;height:100%;display:block;overflow:visible;object-fit:contain;filter:drop-shadow(0 0 var(--glow-blur) var(--glow-color))}.text-layer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;color:var(--text-color);font-family:var(--font-family);font-size:var(--font-size);font-weight:700;text-shadow:0 0 var(--glow-blur) var(--glow-color);white-space:pre-wrap;padding:6px}.anim-float{animation:mkFloat var(--anim-duration) ease-in-out infinite}.anim-sway{animation:mkSway var(--anim-duration) ease-in-out infinite}.anim-breathe{animation:mkBreathe var(--anim-duration) ease-in-out infinite}.anim-pulse{animation:mkPulse var(--anim-duration) ease-in-out infinite}.anim-twinkle{animation:mkTwinkle var(--anim-duration) ease-in-out infinite}.anim-rotate{animation:mkRotate var(--anim-duration) linear infinite}@keyframes mkFloat{0%,100%{translate:0 0}50%{translate:0 calc(var(--strength)*-1px)}}@keyframes mkSway{0%,100%{rotate:calc(var(--strength)*-.35deg)}50%{rotate:calc(var(--strength)*.35deg)}}@keyframes mkBreathe{0%,100%{scale:1}50%{scale:calc(1 + var(--strength)*.0025)}}@keyframes mkPulse{0%,100%{scale:1;opacity:.88}50%{scale:calc(1 + var(--strength)*.004);opacity:1}}@keyframes mkTwinkle{0%,100%{opacity:.42;filter:drop-shadow(0 0 4px var(--glow-color))}50%{opacity:1;filter:drop-shadow(0 0 var(--glow-blur) var(--glow-color))}}@keyframes mkRotate{to{rotate:360deg}}
  </style>
</head>
<body><div class="viewport"><div id="stage" class="stage"></div></div>
<script>
(() => {
  const MASTER_LOOP=15,$=id=>document.getElementById(id),stage=$('stage');let project=null;
  function svgMarkup(layer){const c=layer.color||'#ffb4e7';if(layer.type==='earLeft'||layer.type==='earRight'){const mirror=layer.type==='earRight'?'transform="translate(200 0) scale(-1 1)"':'';return `<svg class="builtin-svg" viewBox="0 0 200 200"><g ${mirror}><path d="M24 168 C24 88 42 34 94 10 C101 62 110 105 157 151 C116 151 72 159 24 168 Z" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"/><path d="M46 145 C49 91 60 57 84 37 C89 75 100 112 130 140" fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/></g></svg>`}if(layer.type==='sakura')return `<svg class="builtin-svg" viewBox="0 0 200 200"><g fill="${c}" stroke="#fff0fb" stroke-width="2"><path d="M100 92 C56 76 36 36 67 25 C89 17 99 42 100 61 C101 42 112 17 134 25 C165 36 145 76 100 92Z"/><path d="M108 100 C124 56 164 36 175 67 C183 89 158 99 139 100 C158 101 183 112 175 134 C164 165 124 145 108 100Z"/><path d="M100 108 C144 124 164 164 133 175 C111 183 101 158 100 139 C99 158 88 183 66 175 C35 164 55 124 100 108Z"/><path d="M92 100 C76 144 36 164 25 133 C17 111 42 101 61 100 C42 99 17 88 25 66 C36 35 76 55 92 100Z"/></g><circle cx="100" cy="100" r="11" fill="#ffe26d"/></svg>`;if(layer.type==='vine')return `<svg class="builtin-svg" viewBox="0 0 500 150"><path d="M20 106 C135 15 250 139 480 42" fill="none" stroke="#c88b9a" stroke-width="7" stroke-linecap="round"/><g fill="${c}" stroke="#fff0fb" stroke-width="1.5"><circle cx="80" cy="73" r="18"/><circle cx="170" cy="74" r="14"/><circle cx="280" cy="88" r="18"/><circle cx="385" cy="59" r="15"/><circle cx="449" cy="45" r="10"/></g><g fill="#ffe26d"><circle cx="80" cy="73" r="5"/><circle cx="170" cy="74" r="4"/><circle cx="280" cy="88" r="5"/><circle cx="385" cy="59" r="4"/><circle cx="449" cy="45" r="3"/></g></svg>`;if(layer.type==='sparkles')return `<svg class="builtin-svg" viewBox="0 0 500 500"><g fill="${c}"><path d="M90 34 L98 72 L136 80 L98 88 L90 126 L82 88 L44 80 L82 72Z"/><path d="M380 104 L386 130 L412 136 L386 142 L380 168 L374 142 L348 136 L374 130Z"/><path d="M236 296 L245 338 L287 347 L245 356 L236 398 L227 356 L185 347 L227 338Z"/><circle cx="420" cy="360" r="7"/><circle cx="140" cy="410" r="5"/><circle cx="308" cy="82" r="4"/></g></svg>`;return ''}
  function render(){if(!project)return;stage.innerHTML='';stage.style.width=project.canvas.width+'px';stage.style.height=project.canvas.height+'px';project.layers.forEach((layer,index)=>{if(layer.visible===false)return;const el=document.createElement('div');el.className='overlay-layer';if(layer.animation&&layer.animation!=='none')el.classList.add('anim-'+layer.animation);Object.assign(el.style,{left:(layer.x-layer.width/2)+'px',top:(layer.y-layer.height/2)+'px',width:layer.width+'px',height:layer.height+'px',zIndex:index,opacity:(layer.opacity??100)/100,transform:`rotate(${layer.rotation||0}deg)`,'--glow-color':layer.glowColor||'#ff66d6','--glow-blur':(layer.glowBlur||0)+'px','--strength':String(layer.strength||10),'--anim-duration':(MASTER_LOOP/Math.max(1,Number(layer.cycles)||1))+'s'});if(layer.type==='frame'){const shape=document.createElement('div');shape.className='frame-shape';const radius=layer.shape==='circle'?50:layer.shape==='square'?0:layer.shape==='vertical'?Math.min(18,layer.radius||18):(layer.radius||28);Object.assign(shape.style,{'--border-width':(layer.borderWidth||8)+'px','--radius':radius+'%','--c1':layer.color1||'#fce3da','--c2':layer.color2||'#e5a5ac','--c3':layer.color3||'#b96680'});el.appendChild(shape)}else if(layer.type==='image'){const img=document.createElement('img');img.className='image-layer';img.src=layer.src;el.appendChild(img)}else if(layer.type==='text'){const t=document.createElement('div');t.className='text-layer';t.textContent=layer.text||'';Object.assign(t.style,{'--text-color':layer.textColor||'#fff','--font-family':layer.font||'Nunito','--font-size':(layer.fontSize||56)+'px'});el.appendChild(t)}else el.innerHTML=svgMarkup(layer);stage.appendChild(el)});resize()}
  function resize(){if(!project)return;const scale=Math.min(innerWidth/project.canvas.width,innerHeight/project.canvas.height);stage.style.transform=`translate(-50%,-50%) scale(${scale})`}
  async function load(){const params=new URLSearchParams(location.search);if(params.get('local')==='1'){try{project=JSON.parse(localStorage.getItem('mkCameraOverlayProject'))}catch{}}if(!project){const url=params.get('config')||'overlay.json';const response=await fetch(url,{cache:'no-store'});project=await response.json()}project.masterLoop=MASTER_LOOP;render()}
  addEventListener('resize',resize);load().catch(err=>console.error(err));
})();
</script></body></html>
